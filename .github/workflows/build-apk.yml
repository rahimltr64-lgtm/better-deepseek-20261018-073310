name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform files
        shell: bash
        run: |
          set -euo pipefail

          # احتياط: نحفظ كود المشروع قبل أن يعيد flutter create كتابة ملفات القوالب
          mkdir -p /tmp/src_backup
          cp -r lib pubspec.yaml analysis_options.yaml /tmp/src_backup/

          # إنشاء مجلد android/ كاملاً (أيقونات، موارد، MainActivity، إعدادات Gradle)
          flutter create . \
            --project-name kids_learning \
            --org com.example \
            --platforms=android

          # استعادة كود المشروع الأصلي
          cp -rf /tmp/src_backup/. .

          # تطبيق تعديلاتنا: الصلاحيات + الاستقبالات + core library desugaring
          cp -f platform_overrides/android/app/src/main/AndroidManifest.xml \
                android/app/src/main/AndroidManifest.xml

          if [ -f android/app/build.gradle.kts ]; then
            echo "==> Kotlin DSL detected"
            cp -f platform_overrides/android-kts/app/build.gradle.kts \
                  android/app/build.gradle.kts
          else
            echo "==> Groovy DSL detected"
            cp -f platform_overrides/android-groovy/app/build.gradle \
                  android/app/build.gradle
          fi

          echo "---- AndroidManifest (permissions) ----"
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-learning-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
